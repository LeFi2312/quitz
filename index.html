<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta viewport content="width=device-width, initial-scale=1.0">
        <title> QUITZ TIME</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <div class="screen active" id="start-screen">
                <h1>QUITZ TIME!</h1>
                <p>Test your knowlege and have fun!</p>
                <button id="start-btn">Stard quitz</button>

            </div>
        
            <div class="screen" id="Quitz-screen">
                <div class="Quitz-header">
                    <h2 id="question-text">Question goes here</h2>
                    <div class="quitz-info">
                        <p>Question <span id="current-question">1</span> of <span>5</span></p>

                        <p>Score: <span id="score">0</span></p>
                    </div>

                </div>
                <div id="answers-container" class="answers-container">
                    <!--answers will be unserted here from js-->
                </div>
                    <div class="progress-bar">
                        <div id="progress" class="progress">

                    </div>
                </div>
            </div>

            <div id="result-screen" class="screen">
                <h1>Quitz results</h1>
                <div class="result-info">
                    <p>You scored <span id="final-score">0</span> out of <span id="max-score">5</span></p>
                </div>
                <div id="result-message">GOOD JOB</div>
            </div>
            <button id="restart-btn">Restart Quitz</button>
        </div>
    </body>
</html>
